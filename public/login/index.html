<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="robots" content="noindex, nofollow" />
	<title>Connexion — Archives de cours</title>
	<style>
		:root { color-scheme: light dark; }
		body {
			font-family: system-ui, sans-serif;
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			margin: 0;
			background: #16181c;
			color: #f4f4f5;
		}
		main {
			width: 100%;
			max-width: 320px;
			padding: 2rem;
		}
		h1 { font-size: 1.25rem; margin-bottom: 1.5rem; text-align: center; }
		input[type="password"] {
			width: 100%;
			box-sizing: border-box;
			padding: 0.65rem 0.8rem;
			margin-bottom: 1rem;
			border-radius: 6px;
			border: 1px solid #3a3d45;
			background: #1f2228;
			color: inherit;
			font-size: 1rem;
		}
		button {
			width: 100%;
			padding: 0.65rem 0.8rem;
			border-radius: 6px;
			border: none;
			background: #7c5cff;
			color: white;
			font-size: 1rem;
			cursor: pointer;
		}
		button:hover { background: #6a4ce0; }
		.error {
			color: #ff7b7b;
			font-size: 0.9rem;
			margin: -0.5rem 0 1rem;
			text-align: center;
		}
	</style>
</head>
<body>
	<main>
		<h1>Archives de cours</h1>
		<form method="POST" action="/login/">
			<p class="error" id="error" hidden>Mot de passe incorrect.</p>
			<input type="password" name="password" placeholder="Mot de passe" autofocus required />
			<button type="submit">Entrer</button>
		</form>
	</main>
	<script>
		if (new URLSearchParams(location.search).has("error")) {
			document.getElementById("error").hidden = false;
		}
	</script>
</body>
</html>
