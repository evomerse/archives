services:
  archives:
    build: .
    ports:
      - "${HOST_PORT:-8091}:80"
    environment:
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-promo}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:?Définissez BASIC_AUTH_PASSWORD dans .env}
    volumes:
      - ${NOTES_PATH:?Définissez NOTES_PATH dans .env}:/usr/local/apache2/htdocs/notes:ro
    restart: unless-stopped
