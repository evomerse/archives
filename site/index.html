<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8" />
	<title>Archives de cours</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
	<meta name="robots" content="noindex, nofollow" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
	<style>
		:root { --theme-color: #7c5cff; }
		body { background: #16181c; color: #e4e4e7; }
		.markdown-section pre { background: #1f2228; }
		.page-cover {
			height: 220px;
			margin: -40px -30px 30px;
			background-size: cover;
			background-position: center;
			border-radius: 0 0 8px 8px;
			position: relative;
		}
		.page-icon {
			font-size: 56px;
			line-height: 1;
			margin: -50px 0 16px 4px;
			position: relative;
			filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4));
		}
		.page-cover + .page-icon { margin-top: -50px; }

		.toolbar {
			position: fixed;
			top: 12px;
			right: 16px;
			z-index: 20;
			display: flex;
			gap: 8px;
		}
		.toolbar a, .toolbar button {
			font: inherit;
			font-size: 14px;
			padding: 6px 12px;
			border-radius: 6px;
			border: 1px solid #3a3d45;
			background: #1f2228;
			color: #e4e4e7;
			text-decoration: none;
			cursor: pointer;
		}
		.toolbar a:hover, .toolbar button:hover { background: #2a2e36; }

		@media print {
			.toolbar, .sidebar, .sidebar-toggle, .search { display: none !important; }
			.content { left: 0 !important; }
		}
	</style>
</head>
<body>
	<div id="app"></div>
	<div class="toolbar">
		<button type="button" id="new-note-btn">Nouveau fichier</button>
		<a href="/editor/" target="_blank" rel="noopener" id="edit-link">Éditer</a>
		<button type="button" onclick="window.print()">Exporter en PDF</button>
	</div>
	<script>
		var FB_SOURCE = "Archives";

		function currentNotePath() {
			var hash = window.location.hash || "#/";
			var path = decodeURIComponent(hash.replace(/^#\/?/, "").split("?")[0]);
			if (!path) path = "README.md";
			else if (!/\.md$/i.test(path)) path += ".md";
			return path;
		}

		function editorUrlFor(path) {
			var encoded = path
				.split("/")
				.map(function (seg) {
					return encodeURIComponent(seg);
				})
				.join("/");
			return "/editor/files/" + FB_SOURCE + "/" + encoded + "#edit";
		}

		function updateEditLink() {
			var link = document.getElementById("edit-link");
			if (link) link.href = editorUrlFor(currentNotePath());
		}

		async function createNewNote() {
			var name = window.prompt(
				"Nom du nouveau fichier (ex: mon-dossier/ma-note.md) :",
				".md",
			);
			if (!name) return;
			if (!/\.md$/i.test(name)) name += ".md";
			var encoded = name
				.split("/")
				.map(function (seg) {
					return encodeURIComponent(seg);
				})
				.join("/");
			try {
				var res = await fetch(
					"/editor/api/resources?" +
						new URLSearchParams({
							path: "/" + name,
							source: FB_SOURCE,
							override: "false",
						}),
					{ method: "POST", headers: { "Content-Type": "text/plain" }, body: "" },
				);
				if (!res.ok) {
					alert("Échec de la création (" + res.status + "). Existe-t-il déjà ?");
					return;
				}
				window.location.href = "/editor/files/" + FB_SOURCE + "/" + encoded + "#edit";
			} catch (e) {
				alert("Erreur réseau lors de la création du fichier.");
			}
		}

		document.getElementById("new-note-btn").addEventListener("click", createNewNote);
		window.addEventListener("hashchange", updateEditLink);
		updateEditLink();

		window.$docsify = {
			name: "Archives de cours",
			basePath: "/notes/",
			homepage: "README.md",
			loadSidebar: true,
			subMaxLevel: 3,
			auto2top: true,
			search: "auto",
			formatUpdated: "{DD}/{MM}/{YYYY}",
			plugins: [
				function (hook) {
					hook.doneEach(function () {
						updateEditLink();
					});
				},
				function (hook) {
					hook.beforeEach(function (content, next) {
						var fm = content.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);
						if (!fm) {
							next(content);
							return;
						}
						var meta = {};
						fm[1].split("\n").forEach(function (line) {
							var m = line.match(/^(\w+):\s*(.*)$/);
							if (m) meta[m[1]] = m[2].trim();
						});
						var rest = content.slice(fm[0].length);
						var banner = "";
						if (meta.cover) {
							banner +=
								'<div class="page-cover" style="background-image:url(\'' +
								meta.cover +
								'\')"></div>';
						}
						if (meta.icon) {
							banner += '<div class="page-icon">' + meta.icon + "</div>";
						}
						next(banner ? banner + "\n\n" + rest : rest);
					});
				},
			],
		};
	</script>
	<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
